name: Build Caisse Plugin JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Caisse/pom.xml

      - name: Compiler le .jar avec Maven
        run: mvn clean package -f Caisse/pom.xml

      - name: Publier le fichier .jar généré
        uses: actions/upload-artifact@v4
        with:
          name: Caisse-Plugin-JAR
          path: Caisse/target/*.jar
