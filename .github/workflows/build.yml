name: Build Plugin JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java (JDK 25)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Compiler le .jar avec Maven
        run: |
          if [ -f "Caisse/pom.xml" ]; then
            mvn clean package -f Caisse/pom.xml
          elif [ -f "pom.xml" ]; then
            mvn clean package
          else
            echo "Erreur : aucun fichier pom.xml trouvé !"
            ls -la
            exit 1
          fi

      - name: Publier le fichier .jar généré
        uses: actions/upload-artifact@v4
        with:
          name: Caisse-Plugin-JAR
          path: "**/target/*.jar"
